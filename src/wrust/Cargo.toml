[package]
name = "wrust-c"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
addr2line = { version = "0.26", default-features = false, features = ["cpp_demangle", "rustc-demangle"] }
gimli = { version = "0.33", default-features = false, features = ["read-all"] }
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "compression"] }
libc = "0.2"
memmap2 = "0.9"
lru = { version = "0.19.0", default-features = false }
path-clean = "1"

[dev-dependencies]
gimli = { version = "0.33", default-features = false, features = ["write"] }
